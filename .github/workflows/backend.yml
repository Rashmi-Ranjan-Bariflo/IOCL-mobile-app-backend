name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Django
      DEBUG: "False"
      SECRET_KEY: ci-only-not-a-real-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,ioclmobilebg.bc-pl.com,ioclmobileapp.bc-pl.com
      CSRF_TRUSTED_ORIGINS: https://ioclmobilebg.bc-pl.com,https://ioclmobileapp.bc-pl.com
      # Database (CI-only temporary Postgres)
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      # Email (dummy)
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-dummy-password
      DEFAULT_FROM_EMAIL: noreply@ioclmobilebg.bc-pl.com
      # CORS
      CORS_ALLOWED_ORIGINS: https://ioclmobileapp.bc-pl.com,https://ioclmobilebg.bc-pl.com,http://localhost:8081,http://127.0.0.1:8081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # match the base image in your Dockerfile
          cache: pip

      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy on server
        run: /home/bfl/IoclMobile_app/IOCL-mobile-app-backend/deploy.sh
